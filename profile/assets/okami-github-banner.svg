<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OkamiOps — AI sovereignty, AppSec and DevSecOps</title>
  <desc id="desc">A dark premium banner for OkamiOps with gradient accents, technical grid, and positioning around multi-LLM systems, AppSec and DevSecOps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05050A"/>
      <stop offset="0.52" stop-color="#090912"/>
      <stop offset="1" stop-color="#020306"/>
    </linearGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(287 98) rotate(38.5) scale(486 308)">
      <stop stop-color="#8B5CF6" stop-opacity="0.58"/>
      <stop offset="0.42" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(971 290) rotate(155) scale(438 250)">
      <stop stop-color="#14B8A6" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#0F766E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="173" y1="59" x2="1039" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="0.68" stop-color="#2DD4BF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.56  0 1 0 0 0.36  0 0 1 0 0.96  0 0 0 0.75 0" result="color"/>
      <feMerge>
        <feMergeNode in="color"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="white" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #9CA3AF; }
      .soft { fill: #D1D5DB; }
      .white { fill: #F8FAFC; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="34" fill="url(#violet)"/>
  <rect width="1200" height="420" rx="34" fill="url(#emerald)"/>
  <rect x="1" y="1" width="1198" height="418" rx="33" stroke="white" stroke-opacity="0.1"/>
  <rect width="1200" height="420" rx="34" fill="url(#grid)" opacity="0.72"/>

  <path d="M155 327 C 286 188, 385 318, 514 179 S 786 78, 1047 201" stroke="url(#line)" stroke-width="1.3"/>
  <path d="M178 86 H1024" stroke="white" stroke-opacity="0.055"/>
  <path d="M178 334 H1024" stroke="white" stroke-opacity="0.055"/>

  <g transform="translate(92 76)">
    <rect x="0" y="0" width="116" height="116" rx="30" fill="white" fill-opacity="0.045" stroke="white" stroke-opacity="0.1"/>
    <path d="M58 19 L84 42 L78 79 L58 97 L38 79 L32 42 L58 19Z" stroke="#EDE9FE" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M43 45 L58 35 L73 45 M43 45 L48 72 L58 82 L68 72 L73 45" stroke="#A78BFA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="49" cy="56" r="3" fill="#2DD4BF" filter="url(#glow)"/>
    <circle cx="67" cy="56" r="3" fill="#A78BFA" filter="url(#glow)"/>
  </g>

  <g transform="translate(234 78)">
    <text class="mono muted" x="0" y="0" font-size="13" letter-spacing="2.8">OKAMIOPS / PUBLIC ENGINEERING SURFACE</text>
    <text class="sans white" x="0" y="64" font-size="58" font-weight="650" letter-spacing="-2.2">AI systems with</text>
    <text class="sans white" x="0" y="122" font-size="58" font-weight="650" letter-spacing="-2.2">teeth, taste &amp; control.</text>
    <text class="sans soft" x="2" y="165" font-size="20" font-weight="420" letter-spacing="-0.25">AI sovereignty · AppSec · DevSecOps · multi-LLM architecture</text>
    <text class="sans muted" x="2" y="199" font-size="16" font-weight="400">Provider freedom, practical compliance evidence and secure delivery for SMEs.</text>
  </g>

  <g transform="translate(236 314)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#7C3AED" fill-opacity="0.18" stroke="#A78BFA" stroke-opacity="0.38"/>
    <text class="mono soft" x="20" y="23" font-size="12" letter-spacing="0.7">MULTI-LLM</text>
    <rect x="152" y="0" width="128" height="36" rx="18" fill="#0F766E" fill-opacity="0.18" stroke="#2DD4BF" stroke-opacity="0.36"/>
    <text class="mono soft" x="174" y="23" font-size="12" letter-spacing="0.7">APPSEC</text>
    <rect x="292" y="0" width="152" height="36" rx="18" fill="#111827" fill-opacity="0.78" stroke="white" stroke-opacity="0.11"/>
    <text class="mono soft" x="314" y="23" font-size="12" letter-spacing="0.7">DEVSECOPS</text>
    <rect x="456" y="0" width="178" height="36" rx="18" fill="#111827" fill-opacity="0.78" stroke="white" stroke-opacity="0.11"/>
    <text class="mono soft" x="478" y="23" font-size="12" letter-spacing="0.7">SÃO PAULO · MUNICH</text>
  </g>

  <g transform="translate(882 86)">
    <rect x="0" y="0" width="214" height="208" rx="22" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.1"/>
    <text class="mono muted" x="24" y="40" font-size="12" letter-spacing="1.5">OPERATING POSTURE</text>
    <text class="sans white" x="24" y="79" font-size="24" font-weight="610" letter-spacing="-0.7">secure by</text>
    <text class="sans white" x="24" y="108" font-size="24" font-weight="610" letter-spacing="-0.7">design, not</text>
    <text class="sans white" x="24" y="137" font-size="24" font-weight="610" letter-spacing="-0.7">by theater.</text>
    <path d="M24 164 H190" stroke="white" stroke-opacity="0.09"/>
    <text class="mono muted" x="24" y="188" font-size="11">evidence / evals / rollback</text>
  </g>
</svg>
