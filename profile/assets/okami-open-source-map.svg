<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Okami open-source work</title>
  <desc id="desc">A map of Okami public projects grouped into build and operate AI, secure delivery, and run the business.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b14"/>
      <stop offset="0.52" stop-color="#111329"/>
      <stop offset="1" stop-color="#07181d"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#7c83ab" stroke-opacity=".15" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="1600" height="760" fill="url(#background)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>
  <circle cx="260" cy="110" r="180" fill="#7c3aed" fill-opacity=".18" filter="url(#glow)"/>
  <circle cx="1380" cy="620" r="220" fill="#0f766e" fill-opacity=".18" filter="url(#glow)"/>

  <text x="92" y="100" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">OKAMI OPEN WORK</text>
  <text x="92" y="158" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Tools you can inspect, run and adapt.</text>
  <text x="92" y="198" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">Public building blocks for AI teams that need visibility, security and provider freedom.</text>

  <g transform="translate(92 274)">
    <rect width="442" height="336" rx="22" fill="#101426" fill-opacity=".94" stroke="#8b5cf6" stroke-opacity=".82" stroke-width="2"/>
    <rect width="442" height="8" rx="4" fill="url(#purple)"/>
    <text x="32" y="64" fill="#e9d5ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">BUILD &amp; OPERATE AI</text>
    <text x="32" y="110" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Okami-Agent</text>
    <text x="32" y="145" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">Sovereign coding agent</text>
    <line x1="32" x2="410" y1="176" y2="176" stroke="#8b5cf6" stroke-opacity=".3"/>
    <text x="32" y="220" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">OkamiCode</text>
    <text x="32" y="255" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">Local-first coding cockpit</text>
    <text x="32" y="307" fill="#ddd6fe" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">OkTally</text>
  </g>

  <g transform="translate(580 274)">
    <rect width="442" height="336" rx="22" fill="#101426" fill-opacity=".94" stroke="#14b8a6" stroke-opacity=".82" stroke-width="2"/>
    <rect width="442" height="8" rx="4" fill="url(#teal)"/>
    <text x="32" y="64" fill="#99f6e4" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">SECURE DELIVERY</text>
    <text x="32" y="110" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">okami-SAMM</text>
    <text x="32" y="145" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">AppSec maturity assessment</text>
    <line x1="32" x2="410" y1="176" y2="176" stroke="#14b8a6" stroke-opacity=".3"/>
    <text x="32" y="220" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">secops-baseline</text>
    <text x="32" y="255" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">CI/CD security baseline</text>
    <text x="32" y="307" fill="#99f6e4" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">okami-sentinel</text>
  </g>

  <g transform="translate(1068 274)">
    <rect width="442" height="336" rx="22" fill="#101426" fill-opacity=".94" stroke="#f59e0b" stroke-opacity=".82" stroke-width="2"/>
    <rect width="442" height="8" rx="4" fill="url(#gold)"/>
    <text x="32" y="64" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">RUN THE BUSINESS</text>
    <text x="32" y="110" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Okami-Monitor</text>
    <text x="32" y="145" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">AI operations mission control</text>
    <line x1="32" x2="410" y1="176" y2="176" stroke="#f59e0b" stroke-opacity=".3"/>
    <text x="32" y="220" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">deskcomm-crm</text>
    <text x="32" y="255" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">Open source AI sales OS</text>
  </g>

  <line x1="92" x2="1508" y1="670" y2="670" stroke="#cbd5e1" stroke-opacity=".2"/>
  <text x="92" y="716" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22">Public code · local-first where it matters · deployable on your terms</text>
  <text x="1508" y="716" fill="#f8fafc" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">github.com/OkamiOps</text>
</svg>
